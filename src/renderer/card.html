<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Billy card</title>
<link rel="stylesheet" href="theme.css">
<style>
  html, body { background: transparent; overflow: hidden; user-select: none; }
  .wrap { padding: 14px; }
  .card { background: var(--surface); border-radius: 22px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 18px 40px rgba(48, 32, 18, .18), 0 2px 6px rgba(48, 32, 18, .10), inset 0 0 0 1px var(--line);
    animation: in 260ms cubic-bezier(.2, 1.4, .4, 1); transform-origin: 30% 50%; }
  @keyframes in { from { opacity: 0; transform: scale(.94) } to { opacity: 1; transform: none } }
  header { display: flex; align-items: center; gap: 10px; }
  .ic { width: 36px; height: 36px; border-radius: 12px; background: var(--paper); display: grid; place-items: center; color: var(--billy); flex: none; overflow: hidden; }
  .ic img { width: 100%; height: 100%; object-fit: cover; }
  .h { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .name { font-weight: 700; font-size: 14px; }
  .cap { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .value { font-size: 26px; font-weight: 750; letter-spacing: -.5px; color: var(--billy); font-variant-numeric: tabular-nums; }
  .x { all: unset; cursor: pointer; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 8px; color: var(--ink-3); }
  .x:hover { background: var(--paper); color: var(--ink); }
  .err { display: flex; gap: 10px; align-items: center; background: #fff4e0; border-radius: 12px; padding: 9px 10px; font-size: 12.5px; color: #6b4a00; }
  .err span { flex: 1; }
  .err button { all: unset; cursor: pointer; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: var(--ink); color: var(--surface); font-size: 12px; }
  .goal-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
  .goal-top b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: var(--paper); border-radius: 99px; overflow: hidden; }
  .bar.thin { height: 4px; }
  .bar i { display: block; height: 100%; background: var(--billy); border-radius: 99px; transition: width 400ms; }
  .funnel { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .stage-col { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
  .col { height: 38px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
  .col i { width: 70%; background: color-mix(in oklab, var(--billy) 38%, var(--paper)); opacity: 1; border-radius: 6px 6px 3px 3px; transition: height 400ms; }
  .stage-col:last-child .col i { background: var(--billy); opacity: 1; }
  .stage-col b { font-size: 13px; font-variant-numeric: tabular-nums; }
  .stage-col small { font-size: 10px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .actions { display: flex; gap: 8px; justify-content: center; }
  .actions button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px;
    background: var(--paper); font-weight: 650; font-size: 12.5px; transition: transform 120ms, background 120ms; }
  .actions button:hover { background: #ece9e3; }
  .actions button:active { transform: scale(.94); }
  .actions button.busy { opacity: .5; }
  .list { display: flex; flex-direction: column; gap: 2px; max-height: 360px; overflow-y: auto; margin: 0 -6px; padding: 0 6px; }
  .list h4 { margin: 2px 0 4px; font-size: 10.5px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
  .row { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 8px 8px; border-radius: 12px; }
  .row.link { cursor: pointer; }
  .row.link:hover { background: var(--paper); }
  .row .u { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--line); }
  .row .u.warn { background: var(--warn); } .row .u.alert { background: var(--alert); }
  .row .art { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; flex: none; }
  .txt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .txt b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .txt small { font-size: 11.5px; color: var(--ink-2); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .txt em { font-style: normal; color: var(--billy); font-weight: 600; }
  .meta { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
  .go { color: var(--ink-3); flex: none; }
  .rule { margin: 0; font-size: 11px; color: var(--ink-3); text-align: center; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="card.js"></script>
</body>
</html>
